name: PR 1 verification

on:
  push:
    branches:
      - feat/foundation-native-bridge
  pull_request:
    paths:
      - ".github/workflows/pr1.yml"
      - "extension/**"
      - "native-host/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize staged PR 1 source bundle
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(scripts/.bootstrap/pr1-source.patch.gz.b64.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LC_ALL=C printf '%s\n' "${parts[@]}" | sort > /tmp/pr1-parts.list
          while IFS= read -r part; do cat "$part"; done < /tmp/pr1-parts.list \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/pr1-source.patch
          git apply --index --check /tmp/pr1-source.patch
          git apply --index /tmp/pr1-source.patch
          git rm -- "${parts[@]}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use npm 11
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.17.0"

      - name: Generate deterministic npm lockfile
        working-directory: extension
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check extension
        working-directory: extension
        run: npm run typecheck

      - name: Test extension
        working-directory: extension
        run: npm test

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Verify extension artifacts
        working-directory: extension
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const m=require("./dist/manifest.json"); if(m.manifest_version!==3) process.exit(1)'
          for file in \
            dist/background/service-worker.js \
            dist/content/content-script.js \
            dist/popup/index.html \
            dist/options/index.html \
            dist/manifest.json; do
            test -f "$file"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: native-host/pyproject.toml

      - name: Install native-host test dependencies
        working-directory: native-host
        run: python -m pip install -e '.[test]'

      - name: Test native host and installer
        working-directory: native-host
        run: |
          python -m compileall -q omarchy_theme_bridge_host
          python -m pytest -q

      - name: Check repository safety and formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD --
          if find . -type f \( -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo "Private key material must not be committed" >&2
            exit 1
          fi
          if grep -RInE '\b(TODO|TBD|FIXME)\b' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            extension native-host README.md docs/architecture.md docs/installation.md docs/privacy.md scripts/verify-pr1.sh; then
            echo "Unresolved placeholder marker found" >&2
            exit 1
          fi

      - name: Commit verified source and lockfile
        if: github.event_name == 'push' && steps.materialize.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add foundation and native bridge"
          git push
